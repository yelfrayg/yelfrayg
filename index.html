<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portfolio - Yassin El Fraygui</title>
        <link rel="stylesheet" href="base.css" />
        <link
            rel="shortcut icon"
            href="./img/Favicon.png"
            type="image/x-icon"
        />
    </head>
    <body>
        <main>
            <section class="section" id="section-1">
                <span class="chapter-number" id="1">1 Introduction</span>
                <div class="welcome-message-wrapper">
                    <div class="welcome-message">
                        <div class="img-wrapper">
                            <img src="./img/personal-foto.jpg" alt="Welcome" />
                        </div>
                        <h1 class="welcome-heading">
                            Hi there, nice to meet you!
                        </h1>
                        <p class="welcome-text">
                            My name is Yassin and I'm a 22 year-old web
                            developer from Cologne, Germany. <br />I am
                            interested in backend and mainly cloud driven
                            architectures. <br />My goal is to master the main
                            AWS services and the cloud.
                        </p>
                    </div>
                </div>
            </section>
            <section class="section" id="section-2">
                <span class="chapter-number" id="2">2 About me</span>
            </section>

            <section class="section" id="section-3">
                <span class="chapter-number" id="3">3 Projects</span>
                <article class="projects-wrapper">
                    <div class="projects-container">
                        <!-- Projects will be dynamically inserted here -->
                    </div>
                </article>
            </section>

            <section class="full-screen">
                <div class="full-screen-content">
                    <span
                        ><code id="full-screen-code"
                            >[esc] to close window</code
                        ></span
                    >
                    <div class="img-wrapper">
                        <img
                            id="full-screen-image"
                            src="./img/praxisprojekt-1.png"
                            alt="Full Screen"
                        />
                    </div>
                </div>
            </section>
        </main>
    </body>
    <script src="./project.js"></script>
</html>
